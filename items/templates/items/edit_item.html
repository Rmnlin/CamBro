{% extends 'base.html' %}
{% block title %}แก้ไขสิ่งของ - TU Exchange{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">แก้ไขสิ่งของ</h1>

    <form method="post" enctype="multipart/form-data" action="{% url 'edit_item' item.item_id %}" class="bg-white rounded-lg shadow p-6 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อสิ่งของ *</label>
            <input type="text" name="title" required value="{{ item.title }}"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">หมวดหมู่ *</label>
            <select name="category" required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">
                <option value="">-- เลือกหมวดหมู่ --</option>
                {% for category in categories %}
                    <option value="{{ category.category_id }}" {% if item.category == category %}selected{% endif %}>{{ category.icon }} {{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียด *</label>
            <textarea name="description" required rows="3"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">{{ item.description }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">สภาพของ</label>
                <select name="condition"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">
                    <option value="new" {% if item.condition == 'new' %}selected{% endif %}>ใหม่</option>
                    <option value="good" {% if item.condition == 'good' %}selected{% endif %}>ดี</option>
                    <option value="fair" {% if item.condition == 'fair' %}selected{% endif %}>พอใช้</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">วิทยาเขต</label>
                <select name="campus"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">
                    <option value="rangsit" {% if item.campus == 'rangsit' %}selected{% endif %}>รังสิต</option>
                    <option value="tha_prachan" {% if item.campus == 'tha_prachan' %}selected{% endif %}>ท่าพระจันทร์</option>
                    <option value="lampang" {% if item.campus == 'lampang' %}selected{% endif %}>ลำปาง</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">จุดนัดรับ</label>
            <input type="text" name="pickup_location" value="{{ item.pickup_location }}"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">ประเภทการยืม</label>
            <div class="flex gap-4 mb-3">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="is_free" value="true" {% if item.is_free %}checked{% endif %}>
                    <span>ฟรี</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="is_free" value="false" {% if not item.is_free %}checked{% endif %}>
                    <span>ให้เช่า</span>
                </label>
            </div>
            <label class="block text-xs text-gray-500 mb-1">มัดจำ (บาท) — ใส่ 0 ถ้าไม่มีมัดจำ</label>
            <input type="number" name="deposit_amount" min="0" value="{{ item.deposit_amount }}"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ยืมได้สูงสุด (วัน)</label>
            <input type="number" name="max_days" value="{{ item.max_days }}" min="1" max="90"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-tu-red">
        </div>

        <button type="submit"
            class="w-full bg-main-blue text-white py-3 rounded-lg font-semibold shadow-sm hover:opacity-80 transition mt-8">
            บันทึกการแก้ไข
        </button>
    </form>
</div>

<script>
function toggleDeposit(el) {
    document.getElementById('deposit-field').classList.toggle('hidden', el.value === 'true');
}
</script>
{% endblock %}
